name: Build Matrix

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Lint
        run: xcrun swift-format lint --recursive ScoutIP

  build:
    name: ${{ matrix.device }} (iOS ${{ matrix.ios }})
    runs-on: xcode-27
    timeout-minutes: 15

    env:
      IPINFO_KEY: ${{ secrets.IPINFO_KEY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone 15
            ios: "17.0"
          - device: iPhone 16
            ios: "18.0"
          - device: iPhone 17
            ios: "26.4"
          - device: iPhone 17
            ios: "27.0"

    steps:
      - uses: actions/checkout@v7

      - name: Prepare simulator
        run: |
          if ! xcrun simctl list devices available "iOS ${{ matrix.ios }}" | grep -q "${{ matrix.device }}"; then
            xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.ios }}
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            IPINFO_KEY="$IPINFO_KEY" \
            -project ScoutIP.xcodeproj \
            -scheme "ScoutIP Actions" \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.ios }}' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            | xcbeautify
